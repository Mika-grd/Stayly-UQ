    ReservaExternaResponse:
      type: object
      description: Resultado de recibir una reserva externa.
      required:
      - identificadorExterno
      - codigoReserva
      - estado
      - resultado
      - total
      properties:
        identificadorExterno:
          type: string
          examples:
          - BKG-778812
        codigoReserva:
          type: string
          examples:
          - RES-2026-00042
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        resultado:
          allOf:
          - $ref: '#/components/schemas/ResultadoReservaExterna'
          description: CREADA o YA_EXISTIA.
        total:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
    ConflictoCanalResponse:
      type: object
      description: Conflicto registrado con un canal externo (RN-18).
      required:
      - id
      - canal
      - identificadorExterno
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - codigoReservaVigente
      - estado
      - fechaRegistro
      properties:
        id:
          type: string
          format: uuid
        canal:
          type: string
        identificadorExterno:
          type: string
          examples:
          - BKG-778812
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        codigoReservaVigente:
          type: string
          description: La que se respetó (RN-18).
          examples:
          - RES-2026-00042
        estado:
          $ref: '#/components/schemas/EstadoConflicto'
        fechaRegistro:
          type: string
          format: date-time
        resolucion:
          type:
          - string
          - 'null'
    ResolverConflictoRequest:
      type: object
      description: Resolución del conflicto.
      required:
      - resolucion
      properties:
        resolucion:
          type: string
          description: Qué se hizo con el caso.
    EventoCanalResponse:
      type: object
      description: Evento de la bitácora de canales.
      required:
      - id
      - canal
      - tipo
      - fecha
      - resultado
      properties:
        id:
          type: string
          format: uuid
        canal:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEventoCanal'
        identificadorExterno:
          type:
          - string
          - 'null'
          examples:
          - BKG-778812
        fecha:
          type: string
          format: date-time
        resultado:
          type: string
    ReporteOcupacionResponse:
      type: object
      description: Reporte de ocupación.
      required:
      - desde
      - hasta
      - apartamentosActivos
      - nochesPeriodo
      - nochesVendidas
      - porcentajeOcupacion
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        apartamentosActivos:
          type: integer
          format: int32
        nochesPeriodo:
          type: integer
          format: int32
        nochesVendidas:
          type: integer
          format: int32
        porcentajeOcupacion:
          type: number
          format: double
          description: nochesVendidas / (apartamentosActivos × nochesPeriodo); es una proporción, no dinero.
    IngresoPorMedioDTO:
      type: object
      description: Ingresos por medio de pago.
      required:
      - medio
      - total
      properties:
        medio:
          $ref: '#/components/schemas/MedioPago'
        total:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
    ReporteIngresosResponse:
      type: object
      description: Reporte de ingresos.
      required:
      - desde
      - hasta
      - total
      - porMedioPago
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        total:
          type: integer
          format: int64
          description: Suma de pagos registrados; los cargos no pagados no cuentan. Valor en pesos colombianos (COP), entero
            sin decimales.
        porMedioPago:
          type: array
          items:
            $ref: '#/components/schemas/IngresoPorMedioDTO'
    ReservasCanalDTO:
      type: object
      description: Reservas de un canal.
      required:
      - canal
      - total
      - canceladas
      - noShow
      properties:
        canal:
          $ref: '#/components/schemas/CanalReserva'
        total:
