openapi: 3.1.0
info:
  title: SGA – Sistema de Gestión de Alojamiento (Stayly-UQ)
  version: 1.0.0
  license:
    name: Uso académico
  description: |-
    API REST del SGA, variante **Stayly-UQ**: apart-hotel con 6 apartamentos en Armenia, Colombia.

    Generada a partir de las hojas *APIs*, *Schemas DTO* y *Errores de Negocio* del modelo.

    **Criterio de códigos HTTP**
    - **400**: formato inválido; el cuerpo o los parámetros no cumplen el schema (lo valida la capa de entrada).
    - **401**: no autenticado (JWT o credencial del canal ausente o inválida).
    - **403**: el rol no tiene permiso o el recurso no pertenece al usuario.
    - **404**: el recurso no existe (`*_NO_ENCONTRADO` / `*_NO_ENCONTRADA`).
    - **409**: conflicto con el estado actual de un recurso (otra reserva, un bloqueo, el estado de la reserva o del folio).
    - **422**: los datos tienen formato válido pero violan una regla de negocio, sin importar el estado actual.

    Todo error devuelve `ErrorNegocioResponse` con un `codigo` estable. Los valores monetarios son enteros en pesos colombianos (COP). Las fechas y horas se expresan en la zona America/Bogota. Los listados se paginan de a 10 elementos.
servers:
- url: http://localhost:8080
  description: Entorno local de desarrollo.
tags:
- name: Autenticación
  description: Registro de huéspedes e inicio de sesión con JWT.
- name: Apartamentos
  description: Catálogo, búsqueda, estado operativo, bloqueos, novedades y calendario de ocupación de los 6 apartamentos.
- name: Reservas
  description: Cotización, creación, modificación y transiciones de negocio de la reserva.
- name: Folio
  description: Cargos, pagos, saldo y cierre del folio de cada reserva.
- name: Temporadas
  description: Temporadas, periodos y estancia mínima (RP-01).
- name: Tarifas
  description: Tarifas por apartamento y temporada, vigentes e histórico.
- name: Política
  description: Versiones de la política de cancelación.
- name: Alojamiento
  description: Configuración única del alojamiento y parámetros de reglas propias (RP-02, RP-03).
- name: Canal externo
  description: Registro de canales, bitácora y contrato del canal externo (autenticado con apiKey).
- name: Conflictos
  description: Revisión y resolución de conflictos con canales externos (RN-18).
- name: Reportes
  description: Reportes de ocupación, ingresos y reservas por canal.
- name: Usuarios
  description: Gestión de usuarios internos por el administrador.
security:
- bearerAuth: []
paths:
  /api/auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registrar huésped
      description: Crea un usuario con rol HUESPED. Endpoint público.
      operationId: registrarHuesped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroHuespedRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          description: 'Formato inválido: el cuerpo o los parámetros no cumplen el schema (campo faltante, tipo o formato
            incorrecto). Códigos: FORMATO_INVALIDO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                FORMATO_INVALIDO:
                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/auth/registro
                    fecha: '2026-10-01T10:15:30-05:00'
        '409':
          description: 'Conflicto con el estado actual de un recurso (otra reserva, un bloqueo, el estado de la reserva o
            del folio). Códigos: CORREO_YA_REGISTRADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CORREO_YA_REGISTRADO:
                  summary: CORREO_YA_REGISTRADO
                  value:
                    codigo: CORREO_YA_REGISTRADO
                    mensaje: Ya existe un usuario con ese correo.
                    regla: '7.2'
                    ruta: /api/auth/registro
                    fecha: '2026-10-01T10:15:30-05:00'
      security: []
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Valida las credenciales y devuelve un JWT. Endpoint público.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: 'Formato inválido: el cuerpo o los parámetros no cumplen el schema (campo faltante, tipo o formato
            incorrecto). Códigos: FORMATO_INVALIDO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                FORMATO_INVALIDO:
                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/auth/login
                    fecha: '2026-10-01T10:15:30-05:00'
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/auth/login
                    fecha: '2026-10-01T10:15:30-05:00'
      security: []
  /api/apartamentos/disponibles:
    get:
      tags:
      - Apartamentos
      summary: Buscar apartamentos disponibles (CU-20)
      description: |-
        Lista los apartamentos activos disponibles para el rango y el grupo, con su valor estimado, paginados de a 10 (RN-01, RN-02, RN-07, RN-20). Consulta pública del portal.

        Actor(es): Huésped, Recepcionista.
      operationId: buscarApartamentosDisponibles
      parameters:
      - name: fechaEntrada
        in: query
        required: false
        description: Fecha de entrada (primera noche).
        schema:
          type: string
          format: date
      - name: fechaSalida
        in: query
        required: false
        description: Fecha de salida (exclusiva).
        schema:
          type: string
          format: date
      - name: fechasNacimiento
        in: query
        required: false
        description: Fechas de nacimiento de los ocupantes; la edad se calcula a la fecha de entrada (3.2).
        schema:
          type: array
          items:
            type: string
            format: date
        style: form
        explode: true
      - name: capacidadMinima
        in: query
        required: false
        description: Capacidad mínima del apartamento.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: precioMaximo
        in: query
        required: false
        description: Valor estimado máximo de la estancia, en pesos colombianos (COP).
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: caracteristicas
        in: query
        required: false
        description: Características que debe tener el apartamento.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentoResumenResponse'
        '400':
          description: 'Formato inválido: el cuerpo o los parámetros no cumplen el schema (campo faltante, tipo o formato
            incorrecto). Códigos: FORMATO_INVALIDO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                FORMATO_INVALIDO:
                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/apartamentos/disponibles
                    fecha: '2026-10-01T10:15:30-05:00'
        '422':
          description: 'Regla de negocio violada por los datos enviados, con formato válido. Códigos: ESTANCIA_SIN_NOCHES,
            FECHA_ENTRADA_PASADA.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ESTANCIA_SIN_NOCHES:
                  summary: ESTANCIA_SIN_NOCHES
                  value:
                    codigo: ESTANCIA_SIN_NOCHES
                    mensaje: La fecha de salida debe ser posterior a la fecha de entrada.
                    regla: RN-03
                    ruta: /api/apartamentos/disponibles
                    fecha: '2026-10-01T10:15:30-05:00'
                FECHA_ENTRADA_PASADA:
                  summary: FECHA_ENTRADA_PASADA
                  value:
                    codigo: FECHA_ENTRADA_PASADA
                    mensaje: La fecha de entrada no puede ser anterior a la fecha actual.
                    regla: RN-04
                    ruta: /api/apartamentos/disponibles
                    fecha: '2026-10-01T10:15:30-05:00'
      security: []
  /api/apartamentos/{identificacion}:
    get:
      tags:
      - Apartamentos
      summary: Consultar detalle de apartamento
      description: Obtiene el detalle de un apartamento. Consulta pública del portal.
      operationId: consultarDetalleApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '404':
          description: 'El recurso no existe. Códigos: APARTAMENTO_NO_ENCONTRADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                APARTAMENTO_NO_ENCONTRADO:
                  summary: APARTAMENTO_NO_ENCONTRADO
                  value:
                    codigo: APARTAMENTO_NO_ENCONTRADO
                    mensaje: No existe el apartamento SUQ-201.
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
      security: []
    put:
      tags:
      - Apartamentos
      summary: Actualizar apartamento
      description: |-
        Reemplaza los datos descriptivos; advierte las reservas que quedan por encima de la nueva capacidad (7.3).

        Actor(es): Administrador.
      operationId: actualizarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartamentoRequest'
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualizacionApartamentoResponse'
        '400':
          description: 'Formato inválido: el cuerpo o los parámetros no cumplen el schema (campo faltante, tipo o formato
            incorrecto). Códigos: FORMATO_INVALIDO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                FORMATO_INVALIDO:
                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '403':
          description: 'Acceso denegado: el rol no tiene permiso o el recurso no pertenece al usuario. Códigos: ACCESO_DENEGADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ACCESO_DENEGADO:
                  summary: ACCESO_DENEGADO
                  value:
                    codigo: ACCESO_DENEGADO
                    mensaje: No tiene permiso sobre este recurso.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '404':
          description: 'El recurso no existe. Códigos: APARTAMENTO_NO_ENCONTRADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                APARTAMENTO_NO_ENCONTRADO:
                  summary: APARTAMENTO_NO_ENCONTRADO
                  value:
                    codigo: APARTAMENTO_NO_ENCONTRADO
                    mensaje: No existe el apartamento SUQ-201.
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '422':
          description: 'Regla de negocio violada por los datos enviados, con formato válido. Códigos: IMAGENES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                IMAGENES_INVALIDAS:
                  summary: IMAGENES_INVALIDAS
                  value:
                    codigo: IMAGENES_INVALIDAS
                    mensaje: El apartamento debe tener entre 1 y 10 imágenes y una principal.
                    regla: '7.3'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Apartamentos
      summary: Retirar apartamento
      description: |-
        Eliminación lógica del apartamento (7.3). No se permite con reservas activas o futuras.

        Actor(es): Administrador.
      operationId: retirarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      responses:
        '204':
          description: Operación exitosa, sin contenido.
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '403':
          description: 'Acceso denegado: el rol no tiene permiso o el recurso no pertenece al usuario. Códigos: ACCESO_DENEGADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ACCESO_DENEGADO:
                  summary: ACCESO_DENEGADO
                  value:
                    codigo: ACCESO_DENEGADO
                    mensaje: No tiene permiso sobre este recurso.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '404':
          description: 'El recurso no existe. Códigos: APARTAMENTO_NO_ENCONTRADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                APARTAMENTO_NO_ENCONTRADO:
                  summary: APARTAMENTO_NO_ENCONTRADO
                  value:
                    codigo: APARTAMENTO_NO_ENCONTRADO
                    mensaje: No existe el apartamento SUQ-201.
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
        '409':
          description: 'Conflicto con el estado actual de un recurso (otra reserva, un bloqueo, el estado de la reserva o
            del folio). Códigos: APARTAMENTO_CON_RESERVAS_ACTIVAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                APARTAMENTO_CON_RESERVAS_ACTIVAS:
                  summary: APARTAMENTO_CON_RESERVAS_ACTIVAS
                  value:
                    codigo: APARTAMENTO_CON_RESERVAS_ACTIVAS
                    mensaje: El apartamento tiene reservas activas o futuras.
                    regla: '7.3'
                    ruta: /api/apartamentos/SUQ-201
                    fecha: '2026-10-01T10:15:30-05:00'
      security:
      - bearerAuth: []
  /api/apartamentos:
    post:
      tags:
      - Apartamentos
      summary: Crear apartamento
      description: |-
        Crea un apartamento. Nace inactivo hasta tener tarifas completas (7.4).

        Actor(es): Administrador.
      operationId: crearApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartamentoRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '400':
          description: 'Formato inválido: el cuerpo o los parámetros no cumplen el schema (campo faltante, tipo o formato
            incorrecto). Códigos: FORMATO_INVALIDO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                FORMATO_INVALIDO:
                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/apartamentos
                    fecha: '2026-10-01T10:15:30-05:00'
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/apartamentos
                    fecha: '2026-10-01T10:15:30-05:00'
        '403':
          description: 'Acceso denegado: el rol no tiene permiso o el recurso no pertenece al usuario. Códigos: ACCESO_DENEGADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ACCESO_DENEGADO:
                  summary: ACCESO_DENEGADO
                  value:
                    codigo: ACCESO_DENEGADO
                    mensaje: No tiene permiso sobre este recurso.
                    regla: '7.2'
                    ruta: /api/apartamentos
                    fecha: '2026-10-01T10:15:30-05:00'
        '409':
          description: 'Conflicto con el estado actual de un recurso (otra reserva, un bloqueo, el estado de la reserva o
            del folio). Códigos: IDENTIFICACION_DUPLICADA.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                IDENTIFICACION_DUPLICADA:
                  summary: IDENTIFICACION_DUPLICADA
                  value:
                    codigo: IDENTIFICACION_DUPLICADA
                    mensaje: Ya existe un apartamento con la identificación SUQ-201.
                    regla: L-04
                    ruta: /api/apartamentos
                    fecha: '2026-10-01T10:15:30-05:00'
        '422':
          description: 'Regla de negocio violada por los datos enviados, con formato válido. Códigos: IMAGENES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                IMAGENES_INVALIDAS:
                  summary: IMAGENES_INVALIDAS
                  value:
                    codigo: IMAGENES_INVALIDAS
                    mensaje: El apartamento debe tener entre 1 y 10 imágenes y una principal.
                    regla: '7.3'
                    ruta: /api/apartamentos
                    fecha: '2026-10-01T10:15:30-05:00'
      security:
      - bearerAuth: []
  /api/apartamentos/{identificacion}/activar:
    put:
      tags:
      - Apartamentos
      summary: Activar apartamento
      description: |-
        Activa el apartamento para la venta; exige tarifas en todas las temporadas (7.4).

        Actor(es): Administrador.
      operationId: activarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201/activar
                    fecha: '2026-10-01T10:15:30-05:00'
        '403':
          description: 'Acceso denegado: el rol no tiene permiso o el recurso no pertenece al usuario. Códigos: ACCESO_DENEGADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ACCESO_DENEGADO:
                  summary: ACCESO_DENEGADO
                  value:
                    codigo: ACCESO_DENEGADO
                    mensaje: No tiene permiso sobre este recurso.
                    regla: '7.2'
                    ruta: /api/apartamentos/SUQ-201/activar
                    fecha: '2026-10-01T10:15:30-05:00'
        '404':
          description: 'El recurso no existe. Códigos: APARTAMENTO_NO_ENCONTRADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                APARTAMENTO_NO_ENCONTRADO:
                  summary: APARTAMENTO_NO_ENCONTRADO
                  value:
                    codigo: APARTAMENTO_NO_ENCONTRADO
                    mensaje: No existe el apartamento SUQ-201.
                    ruta: /api/apartamentos/SUQ-201/activar
                    fecha: '2026-10-01T10:15:30-05:00'
        '409':
          description: 'Conflicto con el estado actual de un recurso (otra reserva, un bloqueo, el estado de la reserva o
            del folio). Códigos: TARIFAS_INCOMPLETAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                TARIFAS_INCOMPLETAS:
                  summary: TARIFAS_INCOMPLETAS
                  value:
                    codigo: TARIFAS_INCOMPLETAS
                    mensaje: El apartamento no tiene tarifa en todas las temporadas.
                    regla: '7.4'
                    ruta: /api/apartamentos/SUQ-201/activar
                    fecha: '2026-10-01T10:15:30-05:00'
      security:
      - bearerAuth: []
  /api/apartamentos/{identificacion}/iniciar-preparacion:
    put:
      tags:
      - Apartamentos
      summary: Iniciar preparación (CU-09)
      description: |-
