                  summary: FORMATO_INVALIDO
                  value:
                    codigo: FORMATO_INVALIDO
                    mensaje: El campo fechaEntrada es obligatorio.
                    ruta: /api/reportes/reservas-por-canal
                    fecha: '2026-10-01T10:15:30-05:00'
                RANGO_FECHAS_INVALIDO:
                  summary: RANGO_FECHAS_INVALIDO
                  value:
                    codigo: RANGO_FECHAS_INVALIDO
                    mensaje: La fecha final debe ser posterior a la fecha inicial.
                    regla: '3.1'
                    ruta: /api/reportes/reservas-por-canal
                    fecha: '2026-10-01T10:15:30-05:00'
        '401':
          description: 'No autenticado: credencial ausente, inválida o vencida. Códigos: CREDENCIALES_INVALIDAS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                CREDENCIALES_INVALIDAS:
                  summary: CREDENCIALES_INVALIDAS
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: Credenciales inválidas.
                    regla: '7.2'
                    ruta: /api/reportes/reservas-por-canal
                    fecha: '2026-10-01T10:15:30-05:00'
        '403':
          description: 'Acceso denegado: el rol no tiene permiso o el recurso no pertenece al usuario. Códigos: ACCESO_DENEGADO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioResponse'
              examples:
                ACCESO_DENEGADO:
                  summary: ACCESO_DENEGADO
                  value:
                    codigo: ACCESO_DENEGADO
                    mensaje: No tiene permiso sobre este recurso.
                    regla: '7.2'
                    ruta: /api/reportes/reservas-por-canal
                    fecha: '2026-10-01T10:15:30-05:00'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT obtenido en POST /api/auth/login. Roles: HUESPED, RECEPCIONISTA, ADMINISTRADOR, PERSONAL_SERVICIO.'
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Credencial del canal externo, generada al registrar el canal. Solo para /api/externo/**.
  parameters:
    CodigoReserva:
      name: codigo
      in: path
      required: true
      description: Código de la reserva.
      schema:
        type: string
        pattern: ^RES-\d{4}-\d{5}$
        examples:
        - RES-2026-00042
    IdentificacionApartamento:
      name: identificacion
      in: path
      required: true
      description: Identificación del apartamento (se normaliza a mayúsculas, L-04).
      schema:
        type: string
        examples:
        - SUQ-201
    IdTemporada:
      name: id
      in: path
      required: true
      description: Identificador de la temporada.
      schema:
        type: string
        format: uuid
    IdUsuario:
      name: id
      in: path
      required: true
      description: Identificador del usuario.
      schema:
        type: string
        format: uuid
    IdConflicto:
      name: id
      in: path
      required: true
      description: Identificador del conflicto de canal.
      schema:
        type: string
        format: uuid
    IdentificadorExterno:
      name: identificadorExterno
      in: path
      required: true
      description: Identificador de la reserva en el canal externo (único por canal, RN-19).
      schema:
        type: string
        examples:
        - BKG-778812
    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, desde 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Tamano:
      name: tamano
      in: query
      required: false
      description: Tamaño de la página; por defecto 10 (12.4).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 10
    Desde:
      name: desde
      in: query
      required: true
      description: Fecha inicial del rango.
      schema:
        type: string
        format: date
    Hasta:
      name: hasta
      in: query
      required: true
      description: Fecha final del rango; debe ser posterior a la inicial (3.1).
      schema:
        type: string
        format: date
  schemas:
    ErrorNegocioResponse:
      type: object
      description: 'Respuesta de error de negocio. El código HTTP sigue el criterio: 400 formato, 422 regla sobre los datos,
        409 conflicto con el estado actual.'
      required:
      - codigo
      - mensaje
      - ruta
      - fecha
      properties:
        codigo:
          type: string
          description: Código estable del error (hoja Errores de Negocio).
          examples:
          - NOCHES_NO_DISPONIBLES
        mensaje:
          type: string
          description: Mensaje en lenguaje del negocio, nunca una traza técnica.
          examples:
          - El apartamento ya tiene una reserva activa que solapa esas noches.
        regla:
          type:
          - string
          - 'null'
          description: 'Regla violada: RN-XX, RP-XX o L-XX.'
          examples:
          - RN-01
        ruta:
          type: string
          description: Endpoint invocado.
          examples:
          - /api/reservas
        fecha:
          type: string
          format: date-time
          description: Momento del error, zona America/Bogota.
    Rol:
      type: string
      description: Rol del usuario en el sistema.
      enum:
      - HUESPED
      - RECEPCIONISTA
      - ADMINISTRADOR
      - PERSONAL_SERVICIO
    RolInterno:
      type: string
      description: Rol interno que asigna el administrador.
      enum:
      - RECEPCIONISTA
      - ADMINISTRADOR
      - PERSONAL_SERVICIO
    EstadoOperativo:
      type: string
      description: Estado operativo del apartamento (7.6).
      enum:
      - PREPARADO
      - OCUPADO
      - PENDIENTE_PREPARACION
      - EN_PREPARACION
      - FUERA_DE_SERVICIO
    EstadoReserva:
      type: string
      description: Estado de la reserva (RN-08).
      enum:
      - PENDIENTE
      - CONFIRMADA
      - EN_CURSO
      - FINALIZADA
      - CANCELADA
      - NO_SHOW
    CanalReserva:
      type: string
      description: Canal por el que entró la reserva.
      enum:
      - PORTAL
      - DIRECTO
      - EXTERNO
    EstadoNoche:
      type: string
      description: Estado de una noche en el calendario de ocupación.
      enum:
      - LIBRE
      - RESERVADA
      - BLOQUEADA
    GravedadNovedad:
      type: string
      description: Gravedad de la novedad.
      enum:
      - BAJA
      - MEDIA
      - ALTA
      - CRITICA
    EstadoFolio:
      type: string
      description: Estado del folio.
      enum:
      - ABIERTO
      - CERRADO
    TipoCargo:
      type: string
      description: Tipo de cargo del folio.
      enum:
      - ALOJAMIENTO
      - SERVICIO_ADICIONAL
      - AJUSTE
      - PENALIDAD
    TipoCargoManual:
      type: string
      description: Tipos de cargo que se registran manualmente (ALOJAMIENTO y PENALIDAD los registra el sistema).
      enum:
      - SERVICIO_ADICIONAL
      - AJUSTE
    MedioPago:
      type: string
      description: Medio de pago.
      enum:
      - EFECTIVO
      - TRANSFERENCIA
      - TARJETA
    EstadoLiquidacion:
      type: string
      description: Estado con el que se liquidó la reserva.
      enum:
      - CANCELADA
      - NO_SHOW
    ResultadoReservaExterna:
      type: string
      description: Resultado de la recepción idempotente (RN-19).
      enum:
      - CREADA
      - YA_EXISTIA
    EstadoConflicto:
      type: string
      description: Estado del conflicto de canal.
      enum:
      - PENDIENTE
      - RESUELTO
    TipoEventoCanal:
      type: string
      description: Tipo de evento de la bitácora de canales.
      enum:
      - DISPONIBILIDAD_CONSULTADA
      - RESERVA_RECIBIDA
      - RESERVA_DUPLICADA
      - CONFLICTO_REGISTRADO
      - CANCELACION_RECIBIDA
    RegistroHuespedRequest:
      type: object
      description: Datos para registrar un huésped.
      required:
      - nombre
      - correo
      - contrasena
      - telefono
      - documentoIdentidad
      - fechaNacimiento
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
          description: Único.
          examples:
          - laura.gomez@correo.com
        contrasena:
          type: string
          description: Mínimo 8 caracteres, con mayúsculas y números.
          minLength: 8
          format: password
        telefono:
          type: string
          examples:
          - +57 310 555 1234
        documentoIdentidad:
          type: string
          examples:
          - '1094888777'
        fechaNacimiento:
          type: string
          format: date
          examples:
          - '1990-05-14'
    LoginRequest:
      type: object
      description: Credenciales de inicio de sesión.
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
          format: email
          examples:
          - laura.gomez@correo.com
        contrasena:
          type: string
          format: password
    TokenResponse:
      type: object
      description: Token JWT emitido al iniciar sesión.
      required:
      - token
      - tipo
      - expiraEn
      - rol
      properties:
        token:
          type: string
          description: JWT.
        tipo:
          type: string
          description: Siempre "Bearer".
          const: Bearer
        expiraEn:
          type: integer
          format: int32
          description: Segundos hasta la expiración.
        rol:
          $ref: '#/components/schemas/Rol'
    UsuarioAdminRequest:
      type: object
      description: Datos de un usuario interno gestionado por el administrador.
      required:
      - nombre
      - correo
      - telefono
      - documentoIdentidad
      - fechaNacimiento
      - rol
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
          description: No editable después de creado.
          examples:
          - laura.gomez@correo.com
        telefono:
          type: string
          examples:
          - +57 310 555 1234
        documentoIdentidad:
          type: string
          examples:
          - '1094888777'
        fechaNacimiento:
          type: string
          format: date
          examples:
          - '1990-05-14'
        rol:
          allOf:
          - $ref: '#/components/schemas/RolInterno'
          description: Rol interno que asigna el administrador.
        contrasena:
          type: string
          description: Solo al crear.
          format: password
          minLength: 8
    UsuarioResponse:
      type: object
      description: Usuario del sistema.
      required:
      - id
      - nombre
      - correo
      - telefono
      - rol
      - activo
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
          examples:
          - laura.gomez@correo.com
        telefono:
          type: string
          examples:
          - +57 310 555 1234
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
          description: false = eliminado lógicamente.
    ImagenDTO:
      type: object
      description: Imagen del apartamento.
      required:
      - url
      - principal
      properties:
        url:
          type: string
          format: uri
          description: Enlace en el servicio externo de almacenamiento.
        principal:
          type: boolean
    UbicacionDTO:
      type: object
      description: Coordenadas geográficas.
      required:
      - latitud
      - longitud
      properties:
        latitud:
          type: number
          format: double
          description: Coordenada, no es dinero.
          examples:
          - 4.5339
        longitud:
          type: number
          format: double
          examples:
          - -75.6811
    ApartamentoRequest:
      type: object
      description: Datos descriptivos del apartamento.
      required:
      - identificacion
      - nombre
      - descripcion
      - dormitorios
      - capacidad
      - admiteMascotas
      - imagenes
      properties:
        identificacion:
          type: string
          description: Única y estable; se normaliza a mayúsculas (L-04).
          examples:
          - SUQ-201
        nombre:
          type: string
        descripcion:
          type: string
        dormitorios:
          type: integer
          format: int32
          description: ≥ 1.
          minimum: 1
        capacidad:
          type: integer
          format: int32
          description: ≥ 1 (tope rígido).
          minimum: 1
        caracteristicas:
          type: array
          items:
            type: string
          description: Dotación y características.
        admiteMascotas:
          type: boolean
          description: RP-02.
        advertenciaAcceso:
          type: string
          description: Limitación de acceso que se advierte al reservar (ej. "Tercer piso sin ascensor").
          examples:
          - Tercer piso sin ascensor
        imagenes:
          type: array
          items:
            $ref: '#/components/schemas/ImagenDTO'
          description: Entre 1 y 10, exactamente una principal.
          minItems: 1
          maxItems: 10
    ApartamentoResumenResponse:
      type: object
      description: Resumen de un apartamento para listados.
      required:
      - identificacion
      - nombre
      - capacidad
      - dormitorios
      - imagenPrincipal
      - caracteristicas
      - admiteMascotas
      properties:
        identificacion:
          type: string
          examples:
          - SUQ-201
        nombre:
          type: string
        capacidad:
          type: integer
          format: int32
        dormitorios:
          type: integer
          format: int32
        imagenPrincipal:
          type: string
          format: uri
        caracteristicas:
          type: array
          items:
            type: string
        admiteMascotas:
          type: boolean
        advertenciaAcceso:
          type:
          - string
          - 'null'
        valorEstimado:
          type:
          - integer
          - 'null'
          format: int64
          description: Solo en búsquedas con fechas y grupo. Valor en pesos colombianos (COP), entero sin decimales.
    ApartamentoDetalleResponse:
      type: object
      description: Detalle completo de un apartamento.
      required:
      - identificacion
      - nombre
      - descripcion
      - dormitorios
      - capacidad
      - caracteristicas
      - admiteMascotas
      - imagenes
      - estadoOperativo
      - activo
      - ubicacion
      properties:
        identificacion:
          type: string
          examples:
          - SUQ-201
        nombre:
          type: string
        descripcion:
          type: string
        dormitorios:
          type: integer
          format: int32
        capacidad:
          type: integer
          format: int32
        caracteristicas:
          type: array
          items:
            type: string
        admiteMascotas:
          type: boolean
        advertenciaAcceso:
          type:
          - string
          - 'null'
        imagenes:
          type: array
          items:
            $ref: '#/components/schemas/ImagenDTO'
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativo'
        activo:
          type: boolean
        ubicacion:
          allOf:
          - $ref: '#/components/schemas/UbicacionDTO'
          description: La del alojamiento.
    ActualizacionApartamentoResponse:
      type: object
      description: Resultado de actualizar un apartamento, con advertencia de capacidad (7.3).
      required:
      - apartamento
      - reservasSobreNuevaCapacidad
      properties:
        apartamento:
          $ref: '#/components/schemas/ApartamentoDetalleResponse'
        reservasSobreNuevaCapacidad:
          type: array
          items:
            type: string
          description: Códigos de reservas que quedan por encima de la nueva capacidad (advertencia 7.3).
    EstadoOperativoResponse:
      type: object
      description: Estado operativo del apartamento tras una transición.
      required:
      - identificacion
      - estadoOperativo
      - fechaCambio
      - autor
      properties:
        identificacion:
          type: string
          examples:
          - SUQ-201
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativo'
        fechaCambio:
          type: string
          format: date-time
        autor:
          type: string
    FueraDeServicioRequest:
      type: object
      description: Motivo para declarar el apartamento fuera de servicio.
      required:
      - motivo
      properties:
        motivo:
          type: string
    BloqueoRequest:
      type: object
      description: Bloqueo de noches de un apartamento.
      required:
      - fechaInicio
      - fechaFin
      - motivo
      properties:
        fechaInicio:
          type: string
          format: date
          description: Primera noche bloqueada.
        fechaFin:
          type: string
          format: date
          description: 'Exclusiva, como la salida: [inicio, fin).'
        motivo:
          type: string
    BloqueoResponse:
      type: object
      description: Bloqueo registrado.
      required:
      - id
      - identificacionApartamento
      - fechaInicio
      - fechaFin
      - motivo
      - autor
      - fechaRegistro
      properties:
        id:
          type: string
          format: uuid
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        motivo:
          type: string
        autor:
          type: string
        fechaRegistro:
          type: string
          format: date-time
    NovedadRequest:
      type: object
      description: Novedad del apartamento (daño, faltante o situación).
      required:
      - descripcion
      - gravedad
      properties:
        descripcion:
          type: string
        gravedad:
          $ref: '#/components/schemas/GravedadNovedad'
    NovedadResponse:
      type: object
      description: Novedad registrada.
      required:
      - id
      - identificacionApartamento
      - fecha
      - autor
      - descripcion
      - gravedad
      properties:
        id:
          type: string
          format: uuid
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fecha:
          type: string
          format: date-time
        autor:
          type: string
        descripcion:
          type: string
        gravedad:
          $ref: '#/components/schemas/GravedadNovedad'
    CalendarioOcupacionResponse:
      type: object
      description: Calendario de ocupación por rango.
      required:
      - desde
      - hasta
      - apartamentos
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        apartamentos:
          type: array
          items:
            $ref: '#/components/schemas/OcupacionApartamentoDTO'
    OcupacionApartamentoDTO:
      type: object
      description: Ocupación de un apartamento noche por noche.
      required:
      - identificacion
      - noches
      properties:
        identificacion:
          type: string
          examples:
          - SUQ-201
        noches:
          type: array
          items:
            $ref: '#/components/schemas/NocheOcupacionDTO'
    NocheOcupacionDTO:
      type: object
      description: Estado de una noche.
      required:
      - fecha
      - estado
      properties:
        fecha:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoNoche'
        codigoReserva:
          type:
          - string
          - 'null'
          description: Si está reservada.
          examples:
          - RES-2026-00042
    CotizacionRequest:
      type: object
      description: Datos para cotizar una estancia.
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - fechasNacimientoOcupantes
      properties:
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          description: Posterior a la entrada (RN-03).
          examples:
          - '2026-12-23'
        fechasNacimientoOcupantes:
          type: array
          items:
            type: string
            format: date
          description: Al menos 1; la edad se calcula (3.2).
          minItems: 1
        mascotasAutorizadas:
          type: integer
          format: int32
          description: Por defecto 0 (RP-02).
          minimum: 0
          default: 0
    CotizacionResponse:
      type: object
      description: Cotización con desglose noche por noche.
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - numeroNoches
      - ocupantesTotales
      - ocupantesFacturables
      - noches
      - valorAlojamiento
      - total
      properties:
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        numeroNoches:
          type: integer
          format: int32
        ocupantesTotales:
          type: integer
          format: int32
        ocupantesFacturables:
          type: integer
          format: int32
        noches:
          type: array
          items:
            $ref: '#/components/schemas/CargoNocheDTO'
          description: Desglose noche por noche.
        valorAlojamiento:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
        cargoMascotas:
          type:
          - integer
          - 'null'
          format: int64
          description: RP-02. Valor en pesos colombianos (COP), entero sin decimales.
        total:
          type: integer
          format: int64
          description: Redondeado al final, nunca noche por noche. Valor en pesos colombianos (COP), entero sin decimales.
    CargoNocheDTO:
      type: object
      description: Valor de una noche.
      required:
      - fecha
      - temporada
      - tarifa
      - ocupantesFacturables
      - subtotal
      properties:
        fecha:
          type: string
          format: date
        temporada:
          type: string
          description: Nombre de la temporada de esa noche.
        tarifa:
          type: integer
          format: int64
          description: Por ocupante facturable. Valor en pesos colombianos (COP), entero sin decimales.
        ocupantesFacturables:
          type: integer
          format: int32
        subtotal:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
    TitularRequest:
      type: object
      description: Titular de la reserva.
      required:
      - nombre
      - documentoIdentidad
      - fechaNacimiento
      - correo
      - telefono
      properties:
        nombre:
          type: string
        documentoIdentidad:
          type: string
          examples:
          - '1094888777'
        fechaNacimiento:
          type: string
          format: date
          examples:
          - '1990-05-14'
        correo:
          type: string
          format: email
          examples:
          - laura.gomez@correo.com
        telefono:
          type: string
          examples:
          - +57 310 555 1234
    OcupanteRequest:
      type: object
      description: Acompañante del titular.
      required:
      - nombre
      - fechaNacimiento
      properties:
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date
          examples:
          - '1990-05-14'
        documentoIdentidad:
          type: string
          description: Opcional para menores.
          examples:
          - '1094888777'
    CrearReservaRequest:
      type: object
      description: 'Datos para crear una reserva. El canal no viaja en el cuerpo: PORTAL si la crea un huésped, DIRECTO si
        la crea recepción.'
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - titular
      properties:
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          description: No anterior a hoy (RN-04).
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        horaEstimadaLlegada:
          type: string
          format: time
          description: Obligatoria antes de confirmar (RN-09). Desde las 21:00 genera recargo por llegada nocturna (RP-03).
            Formato HH:mm.
        titular:
          allOf:
          - $ref: '#/components/schemas/TitularRequest'
          description: Debe ser facturable (3.2).
        acompanantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteRequest'
          description: Ocupantes distintos del titular.
        mascotasAutorizadas:
          type: integer
          format: int32
          description: Por defecto 0 (RP-02).
          minimum: 0
          default: 0
    ModificarReservaRequest:
      type: object
      description: Datos modificables de una reserva (7.5, RN-14).
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - titular
      properties:
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        titular:
          $ref: '#/components/schemas/TitularRequest'
        acompanantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteRequest'
        mascotasAutorizadas:
          type: integer
          format: int32
          description: RP-02.
          minimum: 0
          default: 0
    HoraEstimadaLlegadaRequest:
      type: object
      description: Hora estimada de llegada (RN-09, RP-03).
      required:
      - horaEstimadaLlegada
      properties:
        horaEstimadaLlegada:
          type: string
          format: time
          description: Hora local (America/Bogota), formato HH:mm.
    CancelarReservaRequest:
      type: object
      description: Datos de la cancelación.
      properties:
        motivo:
          type: string
    OcupanteResponse:
      type: object
      description: Ocupante de la reserva.
      required:
      - id
      - nombre
      - fechaNacimiento
      - facturable
      - titular
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date
          examples:
          - '1990-05-14'
        facturable:
          type: boolean
          description: Calculado a la fecha de entrada.
        titular:
          type: boolean
    ValorCongeladoDTO:
      type: object
      description: Valor de la reserva congelado al crear (RN-22).
      required:
      - noches
      - total
      properties:
        noches:
          type: array
          items:
            $ref: '#/components/schemas/CargoNocheDTO'
        total:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
    ReservaResponse:
      type: object
      description: Reserva completa.
      required:
      - codigo
      - estado
      - canal
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - numeroNoches
      - ocupantes
      - mascotasAutorizadas
      - valor
      - versionPolitica
      - saldoFolio
      - fechaCreacion
      properties:
        codigo:
          type: string
          description: Ej. RES-2026-00042.
          examples:
          - RES-2026-00042
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        canal:
          $ref: '#/components/schemas/CanalReserva'
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        advertenciaAcceso:
          type:
          - string
          - 'null'
          description: La del apartamento, para mostrarla antes de confirmar.
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        numeroNoches:
          type: integer
          format: int32
        horaEstimadaLlegada:
          type:
          - string
          - 'null'
          format: time
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteResponse'
          description: Incluye al titular.
        mascotasAutorizadas:
          type: integer
          format: int32
        valor:
          allOf:
          - $ref: '#/components/schemas/ValorCongeladoDTO'
          description: Congelado al crear (RN-22).
        versionPolitica:
          type: integer
          format: int32
          description: Versión congelada.
        saldoFolio:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
        fechaCreacion:
          type: string
          format: date-time
    ReservaResumenResponse:
      type: object
      description: Resumen de una reserva para listados.
      required:
      - codigo
      - estado
      - canal
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - nombreTitular
      - total
      - fechaCreacion
      properties:
        codigo:
          type: string
          examples:
          - RES-2026-00042
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        canal:
          $ref: '#/components/schemas/CanalReserva'
        identificacionApartamento:
          type: string
          examples:
          - SUQ-201
        fechaEntrada:
          type: string
          format: date
          examples:
          - '2026-12-20'
        fechaSalida:
          type: string
          format: date
          examples:
          - '2026-12-23'
        nombreTitular:
          type: string
        total:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
        fechaCreacion:
          type: string
          format: date-time
    LiquidacionReservaResponse:
      type: object
      description: Liquidación de una cancelación o no-show.
      required:
      - codigoReserva
      - estado
      - versionPolitica
      - retencion
      - devolucion
      - saldoFolio
      properties:
        codigoReserva:
          type: string
          examples:
          - RES-2026-00042
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoLiquidacion'
          description: CANCELADA o NO_SHOW.
        versionPolitica:
          type: integer
          format: int32
          description: Versión con la que se liquidó (RN-13).
        retencion:
          type: integer
          format: int64
          description: Registrada como penalidad. Valor en pesos colombianos (COP), entero sin decimales.
        devolucion:
          type: integer
          format: int64
          description: Registrada como saldo a favor; el desembolso ocurre fuera del sistema. Valor en pesos colombianos (COP),
            entero sin decimales.
        saldoFolio:
          type: integer
          format: int64
          description: Negativo = saldo a favor. Valor en pesos colombianos (COP), entero sin decimales.
    MovimientosDelDiaResponse:
      type: object
      description: Llegadas y salidas de un día.
      required:
      - fecha
      - llegadas
      - salidas
      properties:
        fecha:
          type: string
          format: date
        llegadas:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
        salidas:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
    FolioResponse:
      type: object
      description: Folio de la reserva con cargos, pagos y saldo.
      required:
      - id
      - codigoReserva
      - estado
      - cargos
      - pagos
      - totalCargos
      - totalPagos
      - saldo
      properties:
        id:
          type: string
          format: uuid
        codigoReserva:
          type: string
          examples:
          - RES-2026-00042
        estado:
          $ref: '#/components/schemas/EstadoFolio'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDTO'
        pagos:
          type: array
          items:
            $ref: '#/components/schemas/PagoDTO'
        totalCargos:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
        totalPagos:
          type: integer
          format: int64
          description: Valor en pesos colombianos (COP), entero sin decimales.
        saldo:
          type: integer
          format: int64
          description: 'Positivo: debe el huésped; negativo: saldo a favor. Valor en pesos colombianos (COP), entero sin decimales.'
        autorizacionCierre:
          oneOf:
          - $ref: '#/components/schemas/AutorizacionCierreDTO'
          - type: 'null'
          description: Solo si se cerró con saldo.
    CargoDTO:
      type: object
      description: Cargo del folio.
      required:
      - tipo
      - concepto
      - valor
      - fecha
      properties:
        tipo:
          $ref: '#/components/schemas/TipoCargo'
        concepto:
          type: string
        valor:
          type: integer
          format: int64
          description: Negativo si es movimiento inverso. Valor en pesos colombianos (COP), entero sin decimales.
        fecha:
          type: string
          format: date-time
    PagoDTO:
      type: object
      description: Pago del folio.
      required:
      - valor
      - medio
      - fecha
      properties:
        valor:
          type: integer
          format: int64
          description: Negativo si corrige un pago anterior. Valor en pesos colombianos (COP), entero sin decimales.
        medio:
          $ref: '#/components/schemas/MedioPago'
        fecha:
          type: string
          format: date-time
        referencia:
          type:
          - string
          - 'null'
    RegistrarPagoRequest:
      type: object
      description: Pago a registrar en el folio (RN-15).
