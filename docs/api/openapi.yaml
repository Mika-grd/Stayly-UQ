      - valor
      - medio
      - fecha
      properties:
        valor:
          type: integer
          format: int64
          description: Distinto de cero; negativo solo para corregir. Valor en pesos colombianos (COP), entero sin decimales.
          not:
            const: 0
        medio:
          allOf:
          - $ref: '#/components/schemas/MedioPago'
          description: Debe ser un medio aceptado.
        fecha:
          type: string
          format: date-time
        referencia:
          type: string
    RegistrarCargoRequest:
      type: object
      description: Cargo manual a registrar en el folio (RN-16).
      required:
      - tipo
      - concepto
      - valor
      properties:
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoCargoManual'
          description: SERVICIO_ADICIONAL o AJUSTE (ALOJAMIENTO y PENALIDAD los registra el sistema).
        concepto:
          type: string
        valor:
          type: integer
          format: int64
          description: Distinto de cero. Valor en pesos colombianos (COP), entero sin decimales.
          not:
            const: 0
    CerrarFolioRequest:
      type: object
      description: Datos para cerrar el folio (RN-17).
