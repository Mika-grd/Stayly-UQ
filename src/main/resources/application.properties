spring.application.name=sga-stayly-uq

# Persistencia en desarrollo (12.2): H2 en memoria. Cada arranque crea el esquema y carga los datos de prueba.
spring.datasource.url=jdbc:h2:mem:sga;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# Consola en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:sga, usuario sa, sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Datos de prueba de la seccion 12.3 (CargaDatosPrueba); en false la base arranca vacia
sga.datos-prueba.habilitado=true

# RN-21: vencimiento automatico de reservas PENDIENTE fuera del plazo de confirmacion (CU-17)
sga.vencimiento.habilitado=true
sga.vencimiento.retraso-inicial=PT1M
sga.vencimiento.intervalo=PT5M

# Ficha del Alojamiento (Anexo A) - Stayly-UQ, Armenia.
# Son configuracion, no constantes del codigo: el dominio los pide al puerto ConfiguracionAlojamiento.

# A.1 Identidad y ubicacion (F-13: un unico alojamiento)
sga.alojamiento.nombre=Stayly-UQ
sga.alojamiento.descripcion=Edificio de seis apartamentos independientes y totalmente equipados para visitantes de la universidad, viajeros de negocios y turistas del Eje Cafetero.
sga.alojamiento.ciudad=Armenia, Quindio
sga.alojamiento.direccion=Carrera 15 con Calle 12 Norte, sector norte
sga.alojamiento.latitud=4.5532
sga.alojamiento.longitud=-75.6593

# A.4 Normas de convivencia
sga.alojamiento.normas-convivencia[0]=Silencio de 22:00 a 7:00
sga.alojamiento.normas-convivencia[1]=Prohibido fumar dentro de los apartamentos
sga.alojamiento.normas-convivencia[2]=No se permiten fiestas ni eventos
sga.alojamiento.normas-convivencia[3]=Solo se permite estar a los ocupantes registrados
sga.alojamiento.normas-convivencia[4]=Mascotas con correa en las zonas comunes
sga.alojamiento.normas-convivencia[5]=Separar los residuos para reciclaje

# A.5 Servicios adicionales (L-17) y medios de pago (L-18)
sga.alojamiento.servicios[0].nombre=Desayuno tipico (por persona por dia)
sga.alojamiento.servicios[0].genera-cargo=true
sga.alojamiento.servicios[0].valor=18000
sga.alojamiento.servicios[1].nombre=Parqueadero (por noche, cupo limitado)
sga.alojamiento.servicios[1].genera-cargo=true
sga.alojamiento.servicios[1].valor=15000
sga.alojamiento.servicios[2].nombre=Lavanderia (por carga)
sga.alojamiento.servicios[2].genera-cargo=true
sga.alojamiento.servicios[2].valor=20000
sga.alojamiento.servicios[3].nombre=Traslado a la terminal o al aeropuerto El Eden (por trayecto)
sga.alojamiento.servicios[3].genera-cargo=true
sga.alojamiento.servicios[3].valor=60000
sga.alojamiento.medios-pago=EFECTIVO,TRANSFERENCIA,TARJETA

# A.4 Parametros (seccion 6)

# L-09: anos cumplidos a la fecha de entrada
sga.alojamiento.umbral-edad-facturable=12
# L-12
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=12:00
# L-13: cabe exacto entre 12:00 y 15:00
sga.alojamiento.tiempo-preparacion-horas=3
# L-14
sga.alojamiento.plazo-confirmacion-horas=24
# L-15: hasta esa hora hay recepcion
sga.alojamiento.hora-limite-no-show=23:00

# L-11
sga.alojamiento.anticipo.exigido=true
sga.alojamiento.anticipo.porcentaje=30

# RP-02 (solo SUQ-102, SUQ-202 y SUQ-301 las admiten)
sga.alojamiento.mascotas.cupo-maximo=2
sga.alojamiento.mascotas.cargo-por-noche=25000

# RP-03
sga.alojamiento.recargo-llegada-nocturna.hora-inicio=21:00
sga.alojamiento.recargo-llegada-nocturna.valor=30000

# --- Seguridad y JWT (Guia 12) ---
# La clave NO se escribe aqui (12.4). Se lee de application-secrets.properties (no versionado)
# o, en despliegue, de la variable de entorno SGA_JWT_SECRET.
spring.config.import=optional:classpath:application-secrets.properties
sga.jwt.emisor=sga-stayly-uq
sga.jwt.expiracion-minutos=30

