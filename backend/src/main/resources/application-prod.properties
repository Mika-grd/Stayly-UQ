# Perfil de produccion (Guia 22, 4.5). Solo lo que cambia frente a application.properties.
# Se activa con SPRING_PROFILES_ACTIVE=prod; todos los valores sensibles llegan por variables de entorno.

# Herramientas de desarrollo apagadas en internet
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false
sga.seguridad.herramientas-desarrollo=false

# Persistencia en despliegue (12.2): H2 en modo archivo por defecto; el esquema y los datos se conservan entre
# arranques mientras exista el disco. Una base gestionada (PostgreSQL) se usa solo con SGA_DB_URL, SGA_DB_USUARIO
# y SGA_DB_CLAVE, sin tocar codigo. Los datos de prueba y las cuentas iniciales no se duplican al reiniciar.
spring.datasource.url=${SGA_DB_URL:jdbc:h2:file:./data/sgadb}
spring.jpa.hibernate.ddl-auto=${SGA_DB_ESQUEMA:update}

# Secreto y CORS desde variables de entorno
sga.cors.allowed-origins=${SGA_CORS_ALLOWED_ORIGINS:}
sga.jwt.secret=${SGA_JWT_SECRET}

# Cuenta inicial: solo un administrador, con datos que no estan en el repositorio. Esta lista reemplaza
# completa la de application.properties: las cuentas de prueba (con claves publicas) no se crean.
# En el plan gratuito la base se borra al dormir el servicio: SGA_USUARIOS_INICIALES_HABILITADOS=true.
sga.usuarios-iniciales.habilitados=${SGA_USUARIOS_INICIALES_HABILITADOS:false}
sga.usuarios-iniciales.usuarios[0].nombre=Administrador SGA
sga.usuarios-iniciales.usuarios[0].correo=${SGA_ADMIN_CORREO:}
sga.usuarios-iniciales.usuarios[0].contrasena=${SGA_ADMIN_CONTRASENA:}
sga.usuarios-iniciales.usuarios[0].telefono=${SGA_ADMIN_TELEFONO:}
sga.usuarios-iniciales.usuarios[0].documento=${SGA_ADMIN_DOCUMENTO:}
sga.usuarios-iniciales.usuarios[0].fecha-nacimiento=${SGA_ADMIN_FECHA_NACIMIENTO:}
sga.usuarios-iniciales.usuarios[0].rol=ADMINISTRADOR
